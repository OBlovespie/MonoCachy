sep_right = { open = "[", close = "]" }

progress_label  = { fg = "#FFFFFF", bold = true }
progress_normal = { fg = "#A6A6A6", bg = "#454545" }
progress_error  = { fg = "#B0B0B0", bg = "#707070" }

perm_type  = { fg = "#A0A0A0" }
perm_read  = { fg = "#B0B0B0" }
perm_write = { fg = "#707070" }
perm_exec  = { fg = "#A6A6A6" }
perm_sep   = { fg = "#7F7F7F" }

[input]
border   = { fg = "#D0D0D0" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#D0D0D0" }
active   = { fg = "#C0C0C0" }
inactive = {}

[confirm]
border     = { fg = "#D0D0D0" }
title      = { fg = "#D0D0D0" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "#D0D0D0" }

[tasks]
border  = { fg = "#D0D0D0" }
title   = {}
hovered = { fg = "#C0C0C0", bold = true }

[which]
mask            = { bg = "#313131" }
cand            = { fg = "#B8B8B8" }
rest            = { fg = "#939393" }
desc            = { fg = "#C0C0C0" }
separator       = "  "
separator_style = { fg = "#585858" }

[help]
on      = { fg = "#B8B8B8" }
run     = { fg = "#C0C0C0" }
desc    = { fg = "#939393" }
hovered = { bg = "#585858", bold = true }
footer  = { fg = "#D8D8D8", bg = "#454545" }

[notify]
title_info  = { fg = "#B8B8B8" }
title_warn  = { fg = "#B0B0B0" }
title_error = { fg = "#707070" }

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#B0B0B0" },
	{ mime = "{audio,video}/*", fg = "#C0C0C0" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#707070" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#B8B8B8" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#454545" },

	# Special file
	{ url = "*", is = "orphan", bg = "#707070" },
	{ url = "*", is = "exec"  , fg = "#A6A6A6" },

	# Dummy file
	{ url = "*", is = "dummy", bg = "#707070" },
	{ url = "*/", is = "dummy", bg = "#707070" },

	# Fallback
	{ url = "*/", fg = "#D0D0D0" },
]

[spot]
border = { fg = "#D0D0D0" }
title  = { fg = "#D0D0D0" }
tbl_cell = { fg = "#D0D0D0", reversed = true }
tbl_col = { bold = true }

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#D0D0D0" },
	{ name = ".git", text = "", fg = "#D0D0D0" },
	{ name = ".github", text = "", fg = "#D0D0D0" },
