]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#D8D8D8" },
	{ if = "link", text = "", fg = "#A6A6A6" },
	{ if = "block", text = "", fg = "#B0B0B0" },
	{ if = "char", text = "", fg = "#B0B0B0" },
	{ if = "fifo", text = "", fg = "#B0B0B0" },
	{ if = "sock", text = "", fg = "#B0B0B0" },
