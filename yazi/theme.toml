	{ name = "Documents", text = "", fg = "#D0D0D0" },
	{ name = "Downloads", text = "", fg = "#D0D0D0" },
	{ name = "Library", text = "", fg = "#D0D0D0" },
	{ name = "Movies", text = "", fg = "#D0D0D0" },
	{ name = "Music", text = "", fg = "#D0D0D0" },
	{ name = "Pictures", text = "", fg = "#D0D0D0" },
