
background {
    path = ~/wallpapers/pier.png
    color = rgba(00, 00, 00, 0.8)
    
}


general {
    ignore_empty_input = true
    hide_cursor = true
}


input-field {
    size = 200, 50
    outline_thickness = 2
    dots_center = true
    dots_size = 0.3
    dots_rounding = 0
    dots_spacing = 0.4
    outer_color = rgba(255, 255, 255, 1)
    inner_color = rgba(00, 00, 00, 0.7)
    font_color = rgba(255, 255, 255, 1)
    font_family =  MesloLGLDZ Nerd Font Propo
    placeholder_text = 
    fade_on_empty = false
    rounding = 0
    position = 0, 20
    halign = center
    valign = center
}


label { #Clock
    text = $TIME
    color = rgba(255, 255, 255, 1)
    font_size = 65
    font_family =  MesloLGLDZ Nerd Font Propo
    position = 0, 300
    halign = center
    valign = center
}


label { #Date
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 1) 
    font_size = 17
    font_family =  MesloLGLDZ Nerd Font Propo
    position = 0, 240
    halign = center
    valign = center
}


