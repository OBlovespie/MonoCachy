# apps
bind=SUPER,q,spawn,kitty
bind=SUPER,r,spawn,rofi -show drun
bind=SUPER,grave,spawn,wl-bright set 1.00
bind=SUPER,tab,spawn,wl-bright set 0.70
bind=SUPER,z,spawn,vivaldi
bind=SUPER,n,spawn,swaync-client -t -sw
bind=SUPER,d,spawn,hyprlock
bind=SUPER+SHIFT,w,spawn,waybar -c ~/.config/waybar/config-alt-mango.jsonc
bind=SUPER,w,spawn,killall -9 waybar


# wm
bind=SUPER,space,reload_config
bind=SUPER,m,spawn,wlogout --buttons-per-row 2
bind=SUPER,c,killclient,

# screenshot 
bind=SUPER+SHIFT,s,spawn,hyprshot -m region -o "$HOME/Pictures/Screenshots"

# misc
bind=SUPER+SHIFT,x,spawn,~/.config/rofi/scripts/video-wallpaper.sh 
bind=SUPER,x,spawn,~/.config/rofi/scripts/wallpaper.sh


# music
bind=SUPER+SHIFT,q,spawn,playerctl play-pause
bind=SUPER+alt,q,spawn,playerctl next
bind=SUPER+ctrl,q,spawn,playerctl previous
