window_rule=focused_opacity:0.8,unfocused_opacity:0.8,app_id:org.kde.dolphin
window_rule=focused_opacity:0.8,unfocused_opacity:0.8,app_id:^Spotify$
window_rule=focused_opacity:0.9,unfocused_opacity:0.9,app_id:^vivaldi-stable$


# Example dwindle configuration
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=0
dwindle_vertical_split=0
dwindle_preserve_split=0
dwindle_smart_resize=1
dwindle_drop_simple_split=1

# Example scroller configuration
scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0


# Set layout for all tags at once (equivalent to the two rules below)
tag_rule=id:*,layout_name:dwindle

circle_layout=dwindle,scroller
bind=SUPER,l,switch_layout

# hyprshot: freeze + selection layers
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=no_animation:1,no_blur:1,layer_name:hyprpicker

# wlogout
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:logout_dialog


# swaync 
layer_rule=animation_type_open:slide,animation_type_close:slide,layer_name:swaync-control-center
layer_rule=animation_type_open:slide,animation_type_close:slide,layer_name:swaync-notification-window
